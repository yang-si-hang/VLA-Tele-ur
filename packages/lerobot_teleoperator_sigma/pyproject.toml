[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_sigma"
version = "0.1.0"
description = "LeRobot 0.6 teleoperator integration for Force Dimension Sigma devices"
requires-python = ">=3.12"
dependencies = [
    "forcedimension-core>=1.0,<2",
    "lerobot>=0.6,<0.7",
    "numpy>=2.0,<2.3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_teleoperator_sigma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
