[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_camera_orbbec"
version = "0.1.0"
description = "LeRobot 0.6 RGB camera integration for Orbbec Gemini cameras"
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.6,<0.7",
    "numpy>=2.0,<2.3",
    "opencv-python-headless>=4.9,<4.14",
    "pyorbbecsdk2>=2.1.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_camera_orbbec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
